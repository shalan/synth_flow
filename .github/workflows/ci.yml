# SPDX-License-Identifier: Apache-2.0
name: ci

on:
  push:
    branches: [main, "feature/**", "fix/**", "ci/**"]
  pull_request:

jobs:
  unit:
    name: unit tests (no EDA tools)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyyaml
      - run: sudo apt-get install -y -qq tcl >/dev/null
      - run: python3 test_synth_flow.py

  smoke-bench:
    name: smoke bench (yosys + opensta via OSS CAD Suite)
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyyaml
      - name: Install OSS CAD Suite (yosys, yosys-abc, sta)
        uses: YosysHQ/setup-oss-cad-suite@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Tool versions
        run: |
          yosys -V
          yosys-abc -q version | head -1
          sta -version || echo "opensta not in this OSS CAD Suite build; bench falls back to ABC proxy"
      - run: sudo apt-get install -y -qq tcl >/dev/null
      - name: Unit tests with OpenSTA present (session and incremental-trial regressions run)
        run: python3 test_synth_flow.py
      - name: Two-design smoke bench
        working-directory: bench
        run: ./bench.py --designs uart alu32 --recipes orfs_speed area_classic --tag ci
      - name: Post-pass smoke (persistent session, sizing, hold and DRC repair, Fmax, resume)
        working-directory: bench
        run: |
          ./bench.py --use-sdc --designs uart apb_timer --recipes orfs_speed delay_map --tag ci-postpass \
            --set resize_winner=true --set repair_hold=true --set repair_drc=true --set sta_session=true \
            --set sta_session_verify=true --set fmax_search=true --set keep_names=true
          # a second run must reuse the mapped netlists and ranking STA
          ./bench.py --use-sdc --designs uart --recipes orfs_speed --tag ci-resume --keep-work --set resume=true \
            --set resize_winner=true --set sta_session=true
          grep -l "reused" work/uart/bench.log >/dev/null || (echo "resume did not reuse the mapping" && exit 1)
          ! grep -rl "VERIFY MISMATCH" work/*/work/*/resize 2>/dev/null || (echo "session verify mismatch" && exit 1)
      - name: Every in-house design must synthesize with the reference recipe
        working-directory: bench
        run: |
          ./bench.py --recipes orfs_speed --tag ci-all --designs \
            alu32 mul16_pipe mul32_mac fir8 aes_round sha256_core crc32_8 \
            rr_arbiter16 uart spi_master apb_timer fifo_sync
      - uses: actions/upload-artifact@v4
        with:
          name: bench-results
          path: |
            bench/results/ci*.csv
            bench/results/ci*.env.json
            bench/results/latest.md
